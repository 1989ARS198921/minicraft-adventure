<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MiniCraft Adventure RPG V50 3D</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;touch-action:none}#game{width:100%;height:100%}#hud{position:fixed;left:10px;top:10px;z-index:10;color:#fff;background:#101410dc;border:1px solid #fff3;border-radius:14px;padding:10px;min-width:210px;font-size:13px;pointer-events:auto}#hud button,#quest button{background:#ffffff1a;color:#fff;border:1px solid #fff4;border-radius:9px;padding:7px 9px;font-weight:800;margin:2px}#quest{position:fixed;right:10px;top:10px;z-index:10;color:#fff;background:#101410dc;border:1px solid #fff3;border-radius:14px;padding:10px;min-width:210px;font-size:13px}.bar{height:7px;background:#333;border-radius:5px;overflow:hidden;margin:4px 0}.fill{height:100%;width:100%}.hp{background:#d44}.mp{background:#58a5e6}#cross{position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);z-index:9;pointer-events:none}.c1,.c2{position:absolute;background:#fff}.c1{width:18px;height:2px;top:8px}.c2{height:18px;width:2px;left:8px}#toast{position:fixed;left:50%;bottom:25%;transform:translateX(-50%);z-index:30;background:#101410ee;color:#fff;padding:10px 15px;border-radius:13px;display:none;font-weight:800;text-align:center;max-width:85%}#joy{position:fixed;left:22px;bottom:24px;width:130px;height:130px;border-radius:50%;background:#fff1;border:2px solid #fff4;z-index:20;display:none}#stick{position:absolute;width:58px;height:58px;border-radius:50%;background:#fff4;left:36px;top:36px}.touchbtn{position:fixed;right:18px;z-index:20;width:66px;height:52px;border-radius:14px;border:1px solid #fff4;background:#101c;color:#fff;font-weight:900;display:none}.b1{bottom:155px}.b2{bottom:92px}.b3{bottom:29px}.hot{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:20;display:flex;gap:4px}.slot{width:46px;height:46px;border-radius:9px;background:#101c;color:#fff;border:1px solid #fff4;font-weight:900}.sel{outline:3px solid #fff}@media(pointer:coarse){#joy,.touchbtn{display:block}.hot{bottom:8px}.slot{width:43px;height:43px}}
</style></head><body><div id="game"></div><div id="hud"><b>⚔️ MiniCraft Adventure V50 3D</b><div id="stats"></div><div class="bar"><div id="hp" class="fill hp"></div></div><div class="bar"><div id="mp" class="fill mp"></div></div><button id="save">💾</button><button id="load">↩️</button><button id="reset">🔄</button></div><div id="quest">📜 <b>Квест</b><div id="qtext">Поговори с Борисом</div><button id="interact">Взаимодействовать</button></div><div id="cross"><div class="c1"></div><div class="c2"></div></div><div id="toast"></div><div id="joy"><div id="stick"></div></div><button class="touchbtn b1" id="attack">⚔️</button><button class="touchbtn b2" id="jump">🦘</button><button class="touchbtn b3" id="action">✋</button><div class="hot" id="hot"></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x87ceeb); scene.fog=new THREE.Fog(0x87ceeb,25,90);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,300); camera.position.set(0,2,8);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.6)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x557755,1.4)); const sun=new THREE.DirectionalLight(0xffffff,1.1); sun.position.set(30,50,20); sun.castShadow=true; scene.add(sun);
const mats={grass:new THREE.MeshLambertMaterial({color:0x5d9b42}),dirt:new THREE.MeshLambertMaterial({color:0x8b5a35}),wood:new THREE.MeshLambertMaterial({color:0x8b5a2b}),leaf:new THREE.MeshLambertMaterial({color:0x2f7d32}),stone:new THREE.MeshLambertMaterial({color:0x777777}),roof:new THREE.MeshLambertMaterial({color:0x8b3e2e}),gold:new THREE.MeshLambertMaterial({color:0xd7a52b}),enemy:new THREE.MeshLambertMaterial({color:0x7b3f9e}),npc:new THREE.MeshLambertMaterial({color:0x315f9b}),black:new THREE.MeshLambertMaterial({color:0x101010})};
const box=new THREE.BoxGeometry(1,1,1); const objects=[]; const solid=[];
function cube(x,y,z,s,m,tag=''){let g=s instanceof THREE.Vector3?new THREE.BoxGeometry(s.x,s.y,s.z):new THREE.BoxGeometry(s,s,s);let o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;o.userData.tag=tag;scene.add(o);objects.push(o);return o}
function tree(x,z){cube(x,1.5,z,1,mats.wood,'tree'); for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)cube(x+dx,3,z+dz,1,mats.leaf,'leaf')}
function house(x,z){cube(x,1,z,new THREE.Vector3(4,2,4),mats.wood,'house');let roof=cube(x,2.6,z,new THREE.Vector3(4.6,1,4.6),mats.roof,'roof');}
const ground=cube(0,-.5,0,new THREE.Vector3(90,1,90),mats.grass,'ground');
// village
house(-10,-8);house(0,-10);house(10,-8); cube(0,1,-2,new THREE.Vector3(5,2,3),mats.wood,'townhall');
for(const p of [[-15,-3],[-12,3],[-18,8],[14,0],[17,7],[8,15],[-20,14]])tree(...p);
// road
cube(0,.01,-5,new THREE.Vector3(35,.04,3),mats.dirt,'road');
// NPC Boris
const boris=cube(4,1,-3,new THREE.Vector3(.8,2,.8),mats.npc,'npc:boris');
// cave portal
cube(15,1,16,new THREE.Vector3(5,2,1),mats.stone,'cavewall');cube(15,1,15.45,new THREE.Vector3(2.4,2,1),mats.black,'cave');
// chest
const chest=cube(15,0.65,10,new THREE.Vector3(1.4,1.1,1),mats.gold,'chest');
// enemies
const enemies=[]; function spawn(name,x,z,hp=35,boss=false){const e=cube(x,1,z,new THREE.Vector3(boss?1.5:1,boss?2.2:1.8,boss?1.5:1),mats.enemy,boss?'boss':'enemy'); e.userData={name,hp,maxHp:hp,boss};enemies.push(e);return e}
spawn('Гоблин',11,10);spawn('Гоблин',18,12);spawn('Вожак пещеры',15,14,90,true);
const clock=new THREE.Clock(); const keys={}; let vy=0,onGround=false; let yaw=0,pitch=0; let touchLook=false,lastX=0,lastY=0;
const player={hp:100,maxHp:100,mana:60,maxMana:60,level:1,xp:0,gold:100,attack:14,defense:5,region:'Деревня',questStep:0,questDone:false};
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2200)}
function save(){localStorage.setItem('mc_v50_3d',JSON.stringify({player,cam:{x:camera.position.x,y:camera.position.y,z:camera.position.z,yaw,pitch}}));toast('💾 Сохранено')}
function load(){let s=localStorage.getItem('mc_v50_3d');if(s){let d=JSON.parse(s);Object.assign(player,d.player);camera.position.set(d.cam.x,d.cam.y,d.cam.z);yaw=d.cam.yaw;pitch=d.cam.pitch;toast('↩️ Загружено')}}
function updateHud(){document.getElementById('stats').innerHTML=`⭐ Ур.${player.level} · 💰 ${player.gold}<br>❤️ ${player.hp}/${player.maxHp} · 🔵 ${player.mana}/${player.maxMana}<br>🌍 ${player.region}`;document.getElementById('hp').style.width=(100*player.hp/player.maxHp)+'%';document.getElementById('mp').style.width=(100*player.mana/player.maxMana)+'%';let q=player.questStep===0?'Поговори с Борисом':player.questStep===1?'Иди к пещере':player.questStep===2?'Открой золотой сундук':player.questStep===3?'Победи вожака':player.questDone?'Выполнено':'Вернись к Борису';document.getElementById('qtext').textContent=q}
function xp(n){player.xp+=n;let need=100*player.level;while(player.xp>=need){player.xp-=need;player.level++;player.maxHp+=12;player.maxMana+=8;player.hp=player.maxHp;player.mana=player.maxMana;player.attack+=2;need=100*player.level;toast('⭐ Новый уровень '+player.level)}updateHud()}
function dist(o){return camera.position.distanceTo(o.position)}
function interact(){if(dist(boris)<5&&player.questStep===0){player.questStep=1;toast('📜 Борис: найди мешок яблок в пещере');updateHud();return}if(dist(chest)<5&&player.questStep===1){player.questStep=2;player.gold+=50;toast('📦 Ты нашёл мешок яблок! +50 золота');updateHud();return}if(dist(chest)<5&&player.questStep===2){player.questStep=3;toast('👹 Теперь победи вожака пещеры');updateHud();return}if(player.questStep===3&&player.questDone&&dist(boris)<5){player.gold+=150;xp(150);player.questStep=4;toast('🎉 Борис наградил тебя: +150 золота');updateHud();return}toast('✋ Здесь нечего делать')}
function attack(){let target=null,near=999;for(const e of enemies){if(!e.parent||e.userData.hp<=0)continue;let d=dist(e);if(d<near&&d<5){near=d;target=e}}if(!target){toast('⚔️ Враг слишком далеко');return}let dmg=player.attack;target.userData.hp-=dmg;toast(`⚔️ ${target.userData.name}: -${dmg}`);if(target.userData.hp<=0){target.visible=false;player.gold+=target.userData.boss?80:15;xp(target.userData.boss?120:35);if(target.userData.boss&&player.questStep===3){player.questDone=true;toast('👑 Вожак побеждён! Вернись к Борису');updateHud()}}else{player.hp=Math.max(0,player.hp-(target.userData.boss?10:5));if(player.hp===0){player.hp=player.maxHp;camera.position.set(0,2,8);toast('☠️ Ты возродился в деревне')}updateHud()}}
function jump(){if(onGround){vy=7;onGround=false}}
function move(dt){let f=(keys.KeyW?1:0)-(keys.KeyS?1:0),r=(keys.KeyD?1:0)-(keys.KeyA?1:0);let mag=Math.hypot(f,r)||1;f/=mag;r/=mag;let sp=keys.ShiftLeft?7:4;let dir=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));let right=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));let v=dir.multiplyScalar(f*sp*dt).add(right.multiplyScalar(r*sp*dt));camera.position.add(v);vy-=18*dt;camera.position.y+=vy*dt;if(camera.position.y<=2){camera.position.y=2;vy=0;onGround=true}camera.position.x=Math.max(-40,Math.min(40,camera.position.x));camera.position.z=Math.max(-40,Math.min(40,camera.position.z));if(Math.hypot(camera.position.x-15,camera.position.z-15)<7&&player.region==='Деревня'){player.region='Пещера';toast('🕳️ Ты вошёл в пещеру');updateHud()}if(player.region==='Пещера'&&Math.hypot(camera.position.x-5,camera.position.z-5)<4){player.region='Деревня';toast('🏡 Ты вернулся из пещеры');updateHud()}}
function look(dx,dy){yaw-=dx*.002;pitch=Math.max(-1.3,Math.min(1.3,pitch-dy*.002));camera.rotation.set(pitch,yaw,0,'YXZ')}
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')jump();if(e.code==='KeyE')interact();if(e.code==='KeyF')attack();if(e.code==='KeyK')save()});addEventListener('keyup',e=>keys[e.code]=false);
renderer.domElement.addEventListener('click',()=>{if(matchMedia('(pointer:fine)').matches&&!document.pointerLockElement)renderer.domElement.requestPointerLock?.()});addEventListener('mousemove',e=>{if(document.pointerLockElement)look(e.movementX,e.movementY)});
const joy=document.getElementById('joy'),stick=document.getElementById('stick');let joyActive=false,jx=0,jy=0;function joySet(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.min(45,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);jx=Math.cos(a)*m/45;jy=Math.sin(a)*m/45;stick.style.transform=`translate(${jx*36}px,${jy*36}px)`}joy.addEventListener('pointerdown',e=>{joyActive=true;joy.setPointerCapture(e.pointerId);joySet(e)});joy.addEventListener('pointermove',e=>{if(joyActive)joySet(e)});joy.addEventListener('pointerup',()=>{joyActive=false;jx=jy=0;stick.style.transform=''});document.addEventListener('pointermove',e=>{if(!joyActive&&e.pointerType==='touch'&&e.clientX>innerWidth*.45&&e.clientY<innerHeight*.75&&e.buttons){if(!touchLook){touchLook=true;lastX=e.clientX;lastY=e.clientY}else{look(e.clientX-lastX,e.clientY-lastY);lastX=e.clientX;lastY=e.clientY}}});document.addEventListener('pointerup',()=>touchLook=false);
const oldMove=move; function mobileMove(dt){let f=-jy,r=jx;if(Math.hypot(f,r)>0){let mag=Math.hypot(f,r);f/=mag;r/=mag;let sp=4;let dir=new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));let right=new THREE.Vector3(Math.cos(yaw),0,Math.sin(yaw));camera.position.add(dir.multiplyScalar(f*sp*dt)).add(right.multiplyScalar(r*sp*dt))}oldMove(dt)}
document.getElementById('attack').onclick=attack;document.getElementById('jump').onclick=jump;document.getElementById('action').onclick=interact;document.getElementById('interact').onclick=interact;document.getElementById('save').onclick=save;document.getElementById('load').onclick=load;document.getElementById('reset').onclick=()=>{localStorage.removeItem('mc_v50_3d');location.reload()};
const hot=document.getElementById('hot');['⚔️','🍎','🧪','🔥'].forEach((x,i)=>{let b=document.createElement('button');b.className='slot'+(i===0?' sel':'');b.textContent=x;b.onclick=()=>{document.querySelectorAll('.slot').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');if(i===1){player.hp=Math.min(player.maxHp,player.hp+15);toast('🍎 +15 HP');updateHud()}if(i===2){player.hp=Math.min(player.maxHp,player.hp+40);toast('🧪 +40 HP');updateHud()}if(i===3){player.mana=Math.min(player.maxMana,player.mana+20);toast('🔥 +20 маны');updateHud()}};hot.appendChild(b)});
function animate(){requestAnimationFrame(animate);let dt=Math.min(.033,clock.getDelta());mobileMove(dt);for(const e of enemies){if(!e.visible)continue;let d=e.position.distanceTo(camera.position);if(d<12){e.position.x+=Math.sign(camera.position.x-e.position.x)*dt*.35;e.position.z+=Math.sign(camera.position.z-e.position.z)*dt*.35;if(d<2.2&&Math.random()<.01){player.hp=Math.max(0,player.hp-2);updateHud()}}}renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});updateHud();animate();
</script></body></html>
