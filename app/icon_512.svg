<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Фон: градиент от тёмно-зелёного к голубому -->
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="60%" style="stop-color:#7CB342"/>
      <stop offset="60%" style="stop-color:#8B5A2B"/>
      <stop offset="100%" style="stop-color:#6D4C41"/>
    </linearGradient>
    <linearGradient id="blockTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7CB342"/>
      <stop offset="100%" style="stop-color:#558B2F"/>
    </linearGradient>
    <linearGradient id="blockSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5A2B"/>
      <stop offset="100%" style="stop-color:#6D4C41"/>
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="512" height="512" fill="url(#sky)"/>
  
  <!-- Солнце -->
  <circle cx="400" cy="80" r="40" fill="#FFD54F" opacity="0.9"/>
  
  <!-- Облака -->
  <rect x="80" y="30" width="100" height="30" rx="15" fill="white" opacity="0.8"/>
  <rect x="100" y="20" width="60" height="25" rx="12" fill="white" opacity="0.8"/>
  <rect x="280" y="50" width="80" height="24" rx="12" fill="white" opacity="0.6"/>
  
  <!-- Пиксельный блок земля (центральный элемент) -->
  <g transform="translate(180, 150)">
    <!-- Верхняя грань -->
    <rect x="0" y="0" width="152" height="20" fill="url(#blockTop)"/>
    <!-- Передняя грань -->
    <rect x="0" y="20" width="152" height="232" fill="url(#blockSide)"/>
    <!-- Боковая грань -->
    <rect x="152" y="0" width="20" height="252" fill="#795548"/>
    
    <!-- Детали травы сверху -->
    <rect x="5" y="2" width="20" height="16" fill="#8BC34A" opacity="0.7"/>
    <rect x="30" y="2" width="25" height="16" fill="#9CCC65" opacity="0.6"/>
    <rect x="60" y="2" width="18" height="16" fill="#8BC34A" opacity="0.7"/>
    <rect x="85" y="2" width="22" height="16" fill="#AED581" opacity="0.5"/>
    <rect x="112" y="2" width="20" height="16" fill="#8BC34A" opacity="0.7"/>
    <rect x="138" y="2" width="12" height="16" fill="#9CCC65" opacity="0.6"/>
    
    <!-- Детали земли (пиксели) -->
    <rect x="10" y="35" width="18" height="18" fill="#795548" opacity="0.5"/>
    <rect x="55" y="55" width="22" height="16" fill="#8D6E63" opacity="0.4"/>
    <rect x="100" y="80" width="16" height="20" fill="#795548" opacity="0.5"/>
    <rect x="35" y="120" width="20" height="18" fill="#8D6E63" opacity="0.4"/>
    <rect x="75" y="150" width="18" height="16" fill="#795548" opacity="0.5"/>
    <rect x="120" y="100" width="22" height="20" fill="#8D6E63" opacity="0.4"/>
    
    <!-- Пиксельные трещины -->
    <rect x="30" y="70" width="2" height="30" fill="#5D4037" opacity="0.3"/>
    <rect x="90" y="45" width="25" height="2" fill="#5D4037" opacity="0.3"/>
    <rect x="110" y="130" width="2" height="20" fill="#5D4037" opacity="0.3"/>
  </g>
  
  <!-- Логотип: текст -->
  <g transform="translate(0, 430)">
    <text x="256" y="0" font-family="'Arial Black', Arial, sans-serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle" stroke="#1B5E20" stroke-width="6" paint-order="stroke">MiniCraft</text>
    <text x="256" y="48" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFD54F" text-anchor="middle" stroke="#E65100" stroke-width="3" paint-order="stroke">Adventure</text>
  </g>
</svg>
